name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run validate-data
      - run: npm test
      # Builds without secrets: pages read data at request time, and env is validated lazily.
      - run: npm run build
      # Offline (no network, no secrets). Writes a JSON report into the throwaway CI checkout only.
      - run: npm run eval:packing
